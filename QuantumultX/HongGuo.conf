# 红果短剧去广告 (精准修复版)
# Quantumult X Rewrite
# 严格放行正片视频流与剧集内容接口，仅拦截穿山甲 SDK、广告图片与第三方商单联盟

# 1. 穿山甲 SDK 广告接口拦截 (核心：阻止下发信息流插播广告与商单)
^https?:\/\/.+\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/ url reject-dict
^https?:\/\/.+\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/server_bidding\/ url reject-dict
^https?:\/\/.+\.pglstatp-toutiao\.com\/obj\/ad url reject

# 2. 字节商业广告 API 与打点
^https?:\/\/ads[^\/]*\.zijieapi\.com\/ url reject-dict
^https?:\/\/dig\.bdurl\.net\/ url reject-200

# 3. 用户原有规则 (广告物料与广告图)
^https?:\/\/[^\/]*-reading-ad\.qznovelvod\.com\/ url reject
^https?:\/\/[^\/]*-iosreadingvideo\.qznovelvod\.com\/ url reject
^https?:\/\/[^\/]*-ad-sign\.byteimg\.com\/ url reject

# 4. 第三方商单与联盟广告接口 (阿里百川/城盾，精准拦截商单)
^https?:\/\/[^\/]*\.alibabachengdun\.com\/ url reject
^https?:\/\/amdc-thirdparty\.alipay\.com\/ url reject

# MITM 主机名 (严格排除正片视频流与短剧核心域名)
hostname = *.pangolin-sdk-toutiao.com, *.pglstatp-toutiao.com, ads*.zijieapi.com, dig.bdurl.net, *-reading-ad.qznovelvod.com, *-iosreadingvideo.qznovelvod.com, *-ad-sign.byteimg.com, *.alibabachengdun.com, amdc-thirdparty.alipay.com
