# 红果短剧去广告 (优化防卡顿版)
# Quantumult X Rewrite
# 优化说明: 
#   1. 保留核心 CDN 拦截 (reading-ad 与 iosreadingvideo)，确保广告不反弹
#   2. 将视频拦截从 reject 升级为 reject-200，避免断网导致的画面死卡和倒计时挂起
#   3. 拦截广告图标、水印及数据埋点

# 1. 核心短剧广告视频流拦截 (改用 reject-200，触发播放完成，消除卡顿)
^https?:\/\/[^\/]*-reading-ad\.qznovelvod\.com\/ url reject-200
^https?:\/\/[^\/]*-iosreadingvideo\.qznovelvod\.com\/ url reject-200

# 2. 埋点、打点与数据上报
^https?:\/\/[^\/]*-misc-lq\.fqnovel\.com\/ url reject-200
^https?:\/\/.*\.snssdk\.com\/api\/ad\/ url reject-200
^https?:\/\/.*\.pglstatp-toutiao\.com\/.*\/toutiao\.mp4 url reject-200

# 3. 广告角标、签名与推广图片
^https?:\/\/[^\/]*-ad-sign\.byteimg\.com\/ url reject-img

hostname = *-misc-lq.fqnovel.com, *-reading-ad.qznovelvod.com, *-ad-sign.byteimg.com, *-iosreadingvideo.qznovelvod.com, *.pglstatp-toutiao.com
