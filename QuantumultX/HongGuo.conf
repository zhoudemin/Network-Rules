# =======================================================
# 规则名称: 红果短剧 (番茄短剧) 广告拦截优化规则
# 适用平台: Quantumult X (Rewrite Remote)
# 维护地址: https://github.com/zhoudemin/Network-Rules
# 优化说明: 
#   1. 修复原规则中的语法错误 (rej -> 正规 reject 指令)
#   2. 升级为源头 API 级拦截 (reject-dict)，防止生成广告 UI 容器与倒计时
#   3. 移除导致播放器黑屏/死等倒计时的视频流粗暴拦截
# =======================================================

# [穿山甲广告 SDK 拦截 - 从源头阻止拉取广告元数据]
^https?:\/\/(api-access|toblog)\.pangolin-sdk-toutiao\.com\/api\/ad\/ url reject-dict
^https?:\/\/.*\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/ url reject-dict
^https?:\/\/.*\.pglstatp-toutiao\.com\/(obj|img)\/(ad-app-package|ad)\/.+ url reject-200
^https?:\/\/.*\.pglstatp-toutiao\.com\/.*\/toutiao\.mp4 url reject-200

# [红果/番茄 业务广告接口拦截]
^https?:\/\/.*\.fqnovel\.com\/api\/ad\/ url reject-dict
^https?:\/\/.*\.snssdk\.com\/api\/ad\/ url reject-dict
^https?:\/\/[^\/]*-misc-lq\.fqnovel\.com\/ url reject-200
^https?:\/\/rtlog.*\.fqnovel\.com\/ url reject-200

# [广告角标、水印与推广图片资源拦截]
^https?:\/\/[^\/]*-ad-sign\.byteimg\.com\/ url reject-img
^https?:\/\/.*\.pstatp\.com\/(obj|img)\/ad.+ url reject-img

# 提示：请勿开启 *-reading-ad.qznovelvod.com 的 url reject，否则播放器加载失败会导致画面卡死。
